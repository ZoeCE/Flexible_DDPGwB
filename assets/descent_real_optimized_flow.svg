<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .title { font: 700 32px "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .sub { font: 16px "Microsoft YaHei", Arial, sans-serif; fill: #536171; }
      .label { font: 700 18px "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .small { font: 14px "Microsoft YaHei", Arial, sans-serif; fill: #314155; }
      .tiny { font: 12px "Microsoft YaHei", Arial, sans-serif; fill: #536171; }
      .box { fill: #ffffff; stroke: #2d415c; stroke-width: 2; rx: 8; }
      .payload { fill: #f3fbff; stroke: #34759a; stroke-width: 2; rx: 8; }
      .cable { fill: #fbf7ff; stroke: #6d4fa3; stroke-width: 2; rx: 8; }
      .policy { fill: #f5fff7; stroke: #327449; stroke-width: 2; rx: 8; }
      .ctrl { fill: #fff8ef; stroke: #a45f16; stroke-width: 2; rx: 8; }
      .train { fill: #f7f7f7; stroke: #6d7580; stroke-width: 2; rx: 8; }
      .note { fill: #fffdf7; stroke: #c9982d; stroke-width: 1.5; rx: 8; }
      .arrow { fill: none; stroke: #26384d; stroke-width: 2.6; marker-end: url(#arrow); }
      .arrowPayload { fill: none; stroke: #34759a; stroke-width: 2.6; marker-end: url(#arrowPayload); }
      .arrowCable { fill: none; stroke: #6d4fa3; stroke-width: 2.6; marker-end: url(#arrowCable); }
      .arrowPolicy { fill: none; stroke: #327449; stroke-width: 2.6; marker-end: url(#arrowPolicy); }
      .arrowCtrl { fill: none; stroke: #a45f16; stroke-width: 2.6; marker-end: url(#arrowCtrl); }
      .dash { fill: none; stroke: #6d7580; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrowGray); }
      .dashPayload { fill: none; stroke: #34759a; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrowPayload); }
      .dashCable { fill: none; stroke: #6d4fa3; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrowCable); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#26384d"/></marker>
    <marker id="arrowPayload" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34759a"/></marker>
    <marker id="arrowCable" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6d4fa3"/></marker>
    <marker id="arrowPolicy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#327449"/></marker>
    <marker id="arrowCtrl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a45f16"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6d7580"/></marker>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="48" y="56" class="title">方案 2：Real 现实因素优化款</text>
  <text x="50" y="86" class="sub">主流程只保留真实可获得输入；可选观测补偿放在第二行，用虚线表示两步一次。</text>

  <text x="78" y="150" class="tiny">吊装物 / Payload</text>
  <rect x="70" y="170" width="215" height="95" class="payload"/>
  <text x="92" y="207" class="label">RGB-D Payload</text>
  <text x="92" y="236" class="small">位姿、速度、姿态</text>

  <text x="78" y="330" class="tiny">Cable</text>
  <rect x="70" y="350" width="215" height="95" class="cable"/>
  <text x="92" y="387" class="label">Cable markers</text>
  <text x="92" y="416" class="small">可见标记点</text>

  <rect x="355" y="350" width="215" height="95" class="cable"/>
  <text x="377" y="387" class="label">CableLatPred</text>
  <text x="377" y="416" class="small">markers/history -> 32D</text>

  <rect x="630" y="235" width="230" height="120" class="box"/>
  <text x="653" y="275" class="label">拼接部署观测</text>
  <text x="653" y="305" class="small">Payload core</text>
  <text x="653" y="329" class="small">+ Cable latent + Wind</text>

  <rect x="935" y="235" width="215" height="120" class="policy"/>
  <text x="958" y="275" class="label">PPO-LSTM Actor</text>
  <text x="958" y="305" class="small">同一策略结构</text>
  <text x="958" y="329" class="small">输出 residual 3D</text>

  <rect x="935" y="455" width="215" height="95" class="ctrl"/>
  <text x="958" y="492" class="label">PID 基控制器</text>
  <text x="958" y="521" class="small">obs = Payload visible</text>

  <rect x="1210" y="325" width="150" height="120" class="ctrl"/>
  <text x="1230" y="365" class="label">动作融合</text>
  <text x="1230" y="395" class="small">pid_dq</text>
  <text x="1230" y="419" class="small">+ rl_dq</text>

  <rect x="1210" y="545" width="150" height="80" class="box"/>
  <text x="1234" y="580" class="label">Robot</text>
  <text x="1234" y="607" class="small">执行 dq</text>

  <text x="360" y="575" class="tiny">可选观测补偿 / 每 2 步一次</text>
  <rect x="355" y="595" width="215" height="85" class="train"/>
  <text x="377" y="628" class="label">ObsPredictor</text>
  <text x="377" y="657" class="small">测量-预测-测量</text>

  <rect x="760" y="595" width="215" height="85" class="train"/>
  <text x="782" y="628" class="label">Sim truth</text>
  <text x="782" y="657" class="small">监督 / critic / distill</text>

  <path d="M285 218 C430 218 500 258 630 282" class="arrowPayload"/>
  <path d="M285 398 L355 398" class="arrowCable"/>
  <path d="M570 398 C600 398 600 330 630 318" class="arrowCable"/>
  <path d="M860 295 L935 295" class="arrow"/>
  <path d="M285 218 C515 120 805 140 935 502" class="arrowPayload"/>
  <path d="M1150 295 C1185 295 1185 365 1210 365" class="arrowPolicy"/>
  <path d="M1150 502 C1185 502 1185 405 1210 405" class="arrowCtrl"/>
  <path d="M1285 445 L1285 545" class="arrow"/>
  <path d="M1210 585 C870 715 335 660 178 265" class="dash"/>

  <path d="M178 265 C245 575 295 638 355 638" class="dashPayload"/>
  <path d="M570 638 C620 638 590 305 630 300" class="dashPayload"/>
  <path d="M867 595 C850 515 700 480 570 425" class="dashCable"/>
  <path d="M867 595 C980 570 1020 552 1042 550" class="dash"/>

  <text x="505" y="240" class="tiny">Payload 分支</text>
  <text x="500" y="430" class="tiny">Cable 分支</text>
  <text x="1168" y="286" class="tiny">rl residual</text>
  <text x="1168" y="514" class="tiny">pid base</text>
  <text x="580" y="628" class="tiny">虚线：低频补偿</text>
  <text x="990" y="640" class="tiny">虚线：训练期辅助</text>

  <rect x="80" y="730" width="1240" height="48" class="note"/>
  <text x="105" y="760" class="small">优化款：Payload 由 RGB-D 提供，Cable 由 marker/history 估计；ObsPredictor 只在缺测中间步补偿。</text>
</svg>
